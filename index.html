<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>リアルタイム防災マップ</title>

    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Kiwi+Maru&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Kiwi Maru', sans-serif;
            background: #0d0d1a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #map {
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ===== ヘッダー ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 10px 16px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        .header > * { pointer-events: auto; }

        .header .title {
            font-family: 'Mochiy Pop One', sans-serif;
            font-size: 1.1rem;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }
        .header .title .sub {
            font-family: 'Kiwi Maru', sans-serif;
            font-size: 0.6rem;
            color: #888;
            font-weight: normal;
            display: block;
        }

        .header .update-time {
            font-size: 0.55rem;
            color: #888;
            background: rgba(0,0,0,0.6);
            padding: 3px 10px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.06);
        }

        /* ===== コントロールパネル ===== */
        .control-panel {
            position: fixed;
            bottom: 20px;
            right: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }
        .control-panel > * { pointer-events: auto; }

        .control-panel button {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.06);
            color: #aaa;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-family: 'Kiwi Maru', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 80px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-panel button:hover {
            background: rgba(255, 179, 198, 0.15);
            border-color: rgba(255, 179, 198, 0.3);
            color: #fff;
        }
        .control-panel button.active {
            background: rgba(255, 179, 198, 0.2);
            border-color: #ffb3c6;
            color: #ffb3c6;
        }
        .control-panel button .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 2px;
        }
        .control-panel button .dot.on { background: #7bed9f; }
        .control-panel button .dot.off { background: #444; }

        /* ===== 天気パネル ===== */
        .weather-panel {
            position: fixed;
            bottom: 20px;
            left: 16px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 12px 16px;
            min-width: 130px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .weather-panel .temp {
            font-family: 'Mochiy Pop One', sans-serif;
            font-size: 1.6rem;
            color: #ffb3c6;
        }
        .weather-panel .temp .unit {
            font-size: 0.8rem;
            color: #666;
        }
        .weather-panel .desc {
            font-size: 0.8rem;
            color: #ccc;
            margin-top: -2px;
        }
        .weather-panel .detail {
            font-size: 0.6rem;
            color: #666;
            margin-top: 4px;
            display: flex;
            gap: 10px;
        }

        /* ===== 現在地ボタン ===== */
        .locate-btn {
            position: fixed;
            top: 70px;
            right: 16px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.06);
            color: #aaa;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-family: 'Kiwi Maru', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            pointer-events: auto;
        }
        .locate-btn:hover {
            background: rgba(255, 179, 198, 0.15);
            border-color: rgba(255, 179, 198, 0.3);
            color: #fff;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            color: #888;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.9);
            padding: 16px 28px;
            border-radius: 12px;
            border: 1px solid #222;
        }
        .loading .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #333;
            border-top-color: #ffb3c6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .header .title { font-size: 0.9rem; }
            .header .update-time { font-size: 0.45rem; padding: 2px 6px; }
            .weather-panel { bottom: 75px; left: 10px; padding: 10px 12px; min-width: 100px; }
            .weather-panel .temp { font-size: 1.3rem; }
            .control-panel { bottom: 10px; right: 10px; }
            .control-panel button { padding: 4px 8px; font-size: 0.55rem; min-width: 55px; }
            .locate-btn { top: 60px; right: 10px; padding: 6px 10px; font-size: 0.55rem; }
        }
    </style>
</head>
<body>

    <div class="loading" id="loading">
        <span class="spinner"></span> データ取得中...
    </div>

    <div id="map"></div>

    <!-- ===== ヘッダー ===== -->
    <div class="header">
        <div class="title">
            リアルタイム防災マップ
            <span class="sub">雨雲レーダー 気象庁データ</span>
        </div>
        <div class="update-time" id="updateTime">更新: --</div>
    </div>

    <!-- ===== 天気パネル ===== -->
    <div class="weather-panel" id="weatherPanel">
        <div class="temp" id="tempDisplay">--<span class="unit">°C</span></div>
        <div class="desc" id="weatherDesc">--</div>
        <div class="detail">
            <span id="rainDisplay">降水 --mm</span>
            <span id="windDisplay">風 --m/s</span>
        </div>
    </div>

    <!-- ===== コントロール ===== -->
    <div class="control-panel">
        <button id="btnRain" class="active">
            <span class="dot on" id="dotRain"></span> 雨雲
        </button>
        <button id="btnSatellite">
            <span class="dot off" id="dotSatellite"></span> 衛星
        </button>
        <button id="btnFlood">
            <span class="dot off" id="dotFlood"></span> 洪水
        </button>
        <button id="btnLandslide">
            <span class="dot off" id="dotLandslide"></span> 土砂
        </button>
    </div>

    <!-- ===== 現在地ボタン ===== -->
    <button class="locate-btn" id="locateBtn">現在地</button>

    <script>
        // ================================================================
        // ★★★ 地図初期化 ★★★
        // ================================================================
        const map = L.map('map', {
            center: [35.6812, 139.7671],
            zoom: 8,
            zoomControl: true,
            attributionControl: true
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        // ================================================================
        // ★★★ 変数 ★★★
        // ================================================================
        let rainLayer = null;
        let satelliteLayer = null;
        let floodLayer = null;
        let landslideLayer = null;
        let userMarker = null;

        let layerStates = {
            rain: true,
            satellite: false,
            flood: false,
            landslide: false
        };

        let currentBaseTime = '';
        let currentValidTime = '';
        let currentLat = 35.6812;
        let currentLng = 139.7671;

        // ================================================================
        // ★★★ 気象庁データ取得 ★★★
        // ================================================================
        async function getJMAData() {
            try {
                const url = 'https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json';
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.length > 0) {
                    const latest = data[data.length - 1];
                    currentBaseTime = latest.basetime;
                    currentValidTime = latest.validtime;
                    return { basetime: currentBaseTime, validtime: currentValidTime };
                }
                return null;
            } catch (error) {
                console.warn('気象庁データ取得エラー:', error);
                return null;
            }
        }

        // ================================================================
        // ★★★ 雨雲レーダー（気象庁タイル） ★★★
        // ================================================================
        async function loadRainLayer() {
            if (rainLayer) {
                map.removeLayer(rainLayer);
                rainLayer = null;
                return;
            }

            const data = await getJMAData();
            if (!data) {
                // デモ用のフォールバック
                loadRainLayerFallback();
                return;
            }

            const { basetime, validtime } = data;

            // 気象庁の雨雲タイル（高解像度降水ナウキャスト）
            const tileUrl =
                `https://www.jma.go.jp/bosai/jmatile/data/nowc/${basetime}/none/${validtime}/surf/hrpns/{z}/{x}/{y}.png`;

            rainLayer = L.tileLayer(tileUrl, {
                opacity: 0.6,
                attribution: '気象庁 雨雲レーダー',
                maxZoom: 10,
                minZoom: 4,
                errorTileUrl: '',
                tileSize: 256
            });

            map.addLayer(rainLayer);

            document.getElementById('updateTime').textContent =
                '更新: ' + new Date().toLocaleTimeString() + ' (' + basetime + ')';
        }

        // ================================================================
        // ★★★ フォールバック（デモ用） ★★★
        // ================================================================
        function loadRainLayerFallback() {
            // デモ用の簡易雨雲表示（色付き円）
            const areas = [
                { lat: 35.6, lng: 139.7, r: 0.3 },
                { lat: 35.7, lng: 139.8, r: 0.2 },
                { lat: 35.5, lng: 139.6, r: 0.25 },
                { lat: 35.8, lng: 139.5, r: 0.15 },
            ];

            rainLayer = L.layerGroup();
            areas.forEach(a => {
                const circle = L.circle([a.lat, a.lng], {
                    radius: a.r * 100000,
                    color: '#3498db',
                    fillColor: '#3498db',
                    fillOpacity: 0.15,
                    weight: 1
                }).addTo(rainLayer);
                circle.bindPopup('雨雲（デモ）');
            });
            map.addLayer(rainLayer);
            document.getElementById('updateTime').textContent = '更新: デモモード';
        }

        // ================================================================
        // ★★★ ひまわり衛星画像 ★★★
        // ================================================================
        async function loadSatelliteLayer() {
            if (satelliteLayer) {
                map.removeLayer(satelliteLayer);
                satelliteLayer = null;
                return;
            }

            // 気象庁のひまわり画像タイル（トゥルーカラー）
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');

            // 最新の画像時刻を取得（簡易的に現在時刻を使用）
            const baseTime = y + m + d + h + '00';

            const tileUrl =
                `https://www.jma.go.jp/bosai/himawari/data/satimg/${baseTime}/jp/${baseTime}/REP/ETC/{z}/{x}/{y}.jpg`;

            satelliteLayer = L.tileLayer(tileUrl, {
                opacity: 0.7,
                attribution: '気象庁 ひまわり',
                maxZoom: 8,
                minZoom: 4,
                tileSize: 256
            });

            map.addLayer(satelliteLayer);
        }

        // ================================================================
        // ★★★ 洪水ハザード（デモ） ★★★
        // ================================================================
        function loadFloodLayer() {
            if (floodLayer) {
                map.removeLayer(floodLayer);
                floodLayer = null;
                return;
            }

            const areas = [
                [[35.63, 139.73], [35.66, 139.76], [35.62, 139.78]],
                [[35.58, 139.70], [35.61, 139.74], [35.57, 139.76]],
                [[35.68, 139.80], [35.72, 139.83], [35.67, 139.85]],
            ];

            floodLayer = L.layerGroup();
            areas.forEach(area => {
                const poly = L.polygon(area, {
                    color: '#3498db',
                    fillColor: '#3498db',
                    fillOpacity: 0.15,
                    weight: 2,
                    className: 'flood-zone'
                }).addTo(floodLayer);
                poly.bindPopup('洪水注意区域（デモ）');
            });
            map.addLayer(floodLayer);
        }

        // ================================================================
        // ★★★ 土砂災害（デモ） ★★★
        // ================================================================
        function loadLandslideLayer() {
            if (landslideLayer) {
                map.removeLayer(landslideLayer);
                landslideLayer = null;
                return;
            }

            const areas = [
                [[35.72, 139.38], [35.75, 139.42], [35.70, 139.45]],
                [[35.80, 139.32], [35.84, 139.38], [35.78, 139.40]],
            ];

            landslideLayer = L.layerGroup();
            areas.forEach(area => {
                const poly = L.polygon(area, {
                    color: '#e67e22',
                    fillColor: '#e67e22',
                    fillOpacity: 0.15,
                    weight: 2,
                    className: 'landslide-zone'
                }).addTo(landslideLayer);
                poly.bindPopup('土砂災害注意区域（デモ）');
            });
            map.addLayer(landslideLayer);
        }

        // ================================================================
        // ★★★ レイヤー切替 ★★★
        // ================================================================
        function toggleLayer(name, btnId, dotId, loadFn) {
            const btn = document.getElementById(btnId);
            const dot = document.getElementById(dotId);

            if (layerStates[name]) {
                layerStates[name] = false;
                btn.classList.remove('active');
                dot.className = 'dot off';
                loadFn();
            } else {
                layerStates[name] = true;
                btn.classList.add('active');
                dot.className = 'dot on';
                loadFn();
            }
        }

        document.getElementById('btnRain').addEventListener('click', () => {
            toggleLayer('rain', 'btnRain', 'dotRain', () => {
                if (rainLayer) { map.removeLayer(rainLayer); rainLayer = null; }
                else { loadRainLayer(); }
            });
        });

        document.getElementById('btnSatellite').addEventListener('click', () => {
            toggleLayer('satellite', 'btnSatellite', 'dotSatellite', () => {
                if (satelliteLayer) { map.removeLayer(satelliteLayer); satelliteLayer = null; }
                else { loadSatelliteLayer(); }
            });
        });

        document.getElementById('btnFlood').addEventListener('click', () => {
            toggleLayer('flood', 'btnFlood', 'dotFlood', () => {
                if (floodLayer) { map.removeLayer(floodLayer); floodLayer = null; }
                else { loadFloodLayer(); }
            });
        });

        document.getElementById('btnLandslide').addEventListener('click', () => {
            toggleLayer('landslide', 'btnLandslide', 'dotLandslide', () => {
                if (landslideLayer) { map.removeLayer(landslideLayer); landslideLayer = null; }
                else { loadLandslideLayer(); }
            });
        });

        // ================================================================
        // ★★★ 現在地 ★★★
        // ================================================================
        function locateUser() {
            if (!navigator.geolocation) {
                alert('位置情報に対応していません');
                return;
            }

            document.getElementById('locateBtn').textContent = '取得中...';
            document.getElementById('locateBtn').disabled = true;

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    currentLat = lat;
                    currentLng = lng;

                    if (userMarker) {
                        userMarker.setLatLng([lat, lng]);
                    } else {
                        const icon = L.divIcon({
                            html: '●',
                            className: '',
                            iconSize: [16, 16],
                            iconAnchor: [8, 8]
                        });
                        userMarker = L.marker([lat, lng], { icon: icon }).addTo(map);
                        userMarker.bindPopup('現在地');
                    }
                    map.setView([lat, lng], 11);
                    document.getElementById('locateBtn').textContent = '現在地';
                    document.getElementById('locateBtn').disabled = false;

                    fetchWeather(lat, lng);
                },
                (err) => {
                    alert('位置情報を取得できませんでした: ' + err.message);
                    document.getElementById('locateBtn').textContent = '現在地';
                    document.getElementById('locateBtn').disabled = false;
                }
            );
        }

        // ================================================================
        // ★★★ 天気情報（wttr.in） ★★★
        // ================================================================
        async function fetchWeather(lat, lng) {
            try {
                const url = `https://wttr.in/${lat},${lng}?format=j1&lang=ja`;
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.current_condition) {
                    const c = data.current_condition[0];
                    document.getElementById('tempDisplay').innerHTML =
                        c.temp_C + '<span class="unit">°C</span>';
                    document.getElementById('weatherDesc').textContent = c.weatherDesc[0].value;
                    document.getElementById('rainDisplay').textContent = '降水 ' + (c.precipMM || '0') + 'mm';
                    document.getElementById('windDisplay').textContent = '風 ' + (c.windspeedKmph || '0') + 'm/s';
                }
            } catch (error) {
                console.warn('天気取得エラー:', error);
            }
        }

        // ================================================================
        // ★★★ 自動更新 ★★★
        // ================================================================
        async function refreshData() {
            // 雨雲レイヤーを再読み込み（表示中の場合）
            if (layerStates.rain && rainLayer) {
                map.removeLayer(rainLayer);
                rainLayer = null;
                await loadRainLayer();
            }
            // 衛星レイヤーを再読み込み（表示中の場合）
            if (layerStates.satellite && satelliteLayer) {
                map.removeLayer(satelliteLayer);
                satelliteLayer = null;
                await loadSatelliteLayer();
            }
        }

        // ================================================================
        // ★★★ 初期化 ★★★
        // ================================================================
        document.getElementById('locateBtn').addEventListener('click', locateUser);

        // ローディング表示を消す
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
        }, 1500);

        // 初期データ読み込み
        setTimeout(() => {
            loadRainLayer();
            fetchWeather(35.6812, 139.7671);
        }, 500);

        // 5分ごとに更新
        setInterval(() => {
            refreshData();
            if (currentLat && currentLng) {
                fetchWeather(currentLat, currentLng);
            }
        }, 300000);

        // 30秒ごとに時刻表示更新
        setInterval(() => {
            if (currentBaseTime) {
                document.getElementById('updateTime').textContent =
                    '更新: ' + new Date().toLocaleTimeString() + ' (' + currentBaseTime + ')';
            }
        }, 30000);
    </script>

</body>
</html>
